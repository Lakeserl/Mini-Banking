spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PROD_JWT_ISSUER_URI}

security:
  dev-auth:
    enabled: false

withdrawal:
  account-hash:
    pepper: ${WITHDRAWAL_ACCOUNT_HASH_PEPPER}
