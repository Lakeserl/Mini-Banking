spring:
  application:
    name: mini-banking
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

outbox:
  relay:
    enabled: true
    poll-interval-ms: 200
    batch-size: 100
