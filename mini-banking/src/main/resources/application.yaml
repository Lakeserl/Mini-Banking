spring:
  application:
    name: mini-banking
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest

outbox:
  relay:
    enabled: true
    poll-interval-ms: 200
    batch-size: 100

wallet:
  command:
    max-optimistic-retries: 3

transfer:
  orchestrator:
    max-contention-retries: 12
    contention-backoff-min-ms: 5
    contention-backoff-max-ms: 25
  recovery:
    enabled: true
    poll-interval-ms: 10000
    stuck-threshold-seconds: 30
    max-retries: 3
    batch-size: 50

ledger:
  consumer:
    enabled: true
    group-id: ledger-projector
    retry-backoff-ms: 1000

query:
  consumer:
    enabled: true
    balance-group-id: balance-projector
    tx-history-group-id: tx-history-projector
  rebuild:
    batch-size: 500

reconciliation:
  internal:
    enabled: true
    interval-ms: 3600000
  bank:
    enabled: true
    cron: "0 15 0 * * *"
    pending-deposit-threshold-seconds: 300
