server:
  shutdown: graceful

spring:
  application:
    name: mini-banking
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest

outbox:
  relay:
    enabled: true
    poll-interval-ms: 200
    batch-size: 100

idempotency:
  in-progress-lease-seconds: 120
  cleanup:
    enabled: true
    interval-ms: 3600000

wallet:
  command:
    max-optimistic-retries: 3

withdrawal:
  command:
    max-optimistic-retries: 3
  account-hash:
    pepper: ${WITHDRAWAL_ACCOUNT_HASH_PEPPER:dev-only-withdrawal-account-hash-pepper-change-me}

transfer:
  orchestrator:
    max-contention-retries: 12
    contention-backoff-min-ms: 5
    contention-backoff-max-ms: 25
  recovery:
    enabled: true
    poll-interval-ms: 10000
    stuck-threshold-seconds: 30
    max-retries: 3
    batch-size: 50

ledger:
  consumer:
    enabled: true
    group-id: ledger-projector
    retry-backoff-ms: 1000

query:
  consumer:
    enabled: true
    balance-group-id: balance-projector
    tx-history-group-id: tx-history-projector
  rebuild:
    batch-size: 500

reconciliation:
  internal:
    enabled: true
    interval-ms: 3600000
    wallet-batch-size: 500
  bank:
    enabled: true
    cron: "0 15 0 * * *"
    pending-cron: "0 */5 * * * *"
    pending-deposit-threshold-seconds: 300
    pending-escalation-threshold-seconds: 86400
    failed-withdrawal-lookback-days: 7

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  dev-auth:
    enabled: false
