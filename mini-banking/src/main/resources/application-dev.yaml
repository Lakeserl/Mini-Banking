spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/walletledger}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

security:
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  dev-auth:
    enabled: true
