name: mini-banking

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: walletledger
      POSTGRES_USER: ${DEV_POSTGRES_SUPER_USER:-lakeserl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for dev Postgres}
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5410}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_SUPER_USER:-lakeserl} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mini-banking-dev

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 1024m
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 29092 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mini-banking-dev

  app:
    image: ${IMAGE_REF:-mini-banking:dev-local}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_ENABLED: "false"
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/walletledger_dev}
      DB_USERNAME: ${DB_USERNAME:-mb_dev}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for dev app}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (>=32 bytes) for dev app}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"
    ports:
      - "127.0.0.1:${DEV_DEPLOY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 896m
    stop_grace_period: 35s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mini-banking-dev

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles:
      - debug
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:8085:8080"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mini-banking-dev

volumes:
  postgres_data:
  kafka_data:

networks:
  mini-banking-dev:
    name: mini-banking-dev-net
    driver: bridge
