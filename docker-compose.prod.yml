name: mini-banking-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${PROD_POSTGRES_SUPER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for prod Postgres}
    ports:
      - "127.0.0.1:${PROD_DB_PORT:-5433}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    mem_limit: 512m
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_POSTGRES_SUPER_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mini-banking-prod

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "7M9p4vRkT-fNDsL--Y97tx"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    mem_limit: 1024m
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 29092 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mini-banking-prod

  app:
    image: ${IMAGE_REF:?Set IMAGE_REF (e.g. registry/mini-banking:v1.0.0)}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_FLYWAY_ENABLED=false
      - DB_URL=${DB_URL:-jdbc:postgresql://postgres:5432/walletledger_prod}
      - DB_USERNAME=${DB_USERNAME:-mb_prod_app}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD for prod app}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PROD_JWT_ISSUER_URI=${PROD_JWT_ISSUER_URI:?Set PROD_JWT_ISSUER_URI for Cloud-IAM Keycloak}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
      - WITHDRAWAL_ACCOUNT_HASH_PEPPER=${WITHDRAWAL_ACCOUNT_HASH_PEPPER:?Set WITHDRAWAL_ACCOUNT_HASH_PEPPER (at least 32 bytes)}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - JAVA_TOOL_OPTIONS=-Xmx512m -Xms256m
    ports:
      - "127.0.0.1:${PROD_DEPLOY_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 896m
    stop_grace_period: 35s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mini-banking-prod

volumes:
  postgres_prod_data:
  kafka_prod_data:

networks:
  mini-banking-prod:
    name: mini-banking-prod-net
    driver: bridge
