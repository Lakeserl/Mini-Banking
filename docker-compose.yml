services:
  postgres:
    image: postgres:16-alpine
    container_name: walletledger-postgres
    environment:
      POSTGRES_DB: walletledger
      POSTGRES_USER: lakeserl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakeserl -d walletledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
