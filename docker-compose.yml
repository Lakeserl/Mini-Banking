services:
  postgres:
    image: postgres:16-alpine
    container_name: walletledger-postgres
    environment:
      POSTGRES_DB: walletledger
      POSTGRES_USER: lakeserl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakeserl -d walletledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - walletledger

volumes:
  postgres_data:

networks:
  walletledger:
    driver: bridge
